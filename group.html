<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RodChiron — Group 1SG Command Deck</title>
<style>
/* =========================================================================
   RodChiron — GROUP 1SG Personnel, Readiness, Accountability & Soldier Care.
   Standalone single-file app. All data lives in your browser (localStorage).
   Builds on the Company deck; adds multi-unit roll-up, life/personal case
   management, an editable resource directory, and editable action types.
   ========================================================================= */
:root {
  color-scheme: light;
  --page:        #f4f5f2;
  --surface:     #ffffff;
  --surface-2:   #fbfbf9;
  --surface-3:   #f0f1ed;
  --ink:         #14161a;
  --ink-2:       #52514e;
  --muted:       #7c7b76;
  --line:        #e2e3dc;
  --line-strong: #cfd0c8;
  --brand:       #1d2b3a;   /* group = slate/steel */
  --brand-2:     #2c4155;
  --brand-ink:   #e9eef4;
  --accent:      #b08d3f;
  --focus:       #2a78d6;
  --good:#0ca30c; --good-bg:#e6f5e6;
  --warn:#b8860b; --warn-bg:#faf1d8;
  --serious:#c9622f; --serious-bg:#fbe9df;
  --crit:#cc2f2f; --crit-bg:#fbe3e3;
  --info:#1c5cab; --info-bg:#e4eefb;
  --c1:#2a78d6; --c2:#1baf7a; --c3:#eda100; --c4:#008300;
  --c5:#4a3aa7; --c6:#e34948; --c7:#e87ba4; --c8:#eb6834;
  --radius: 10px; --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(20,22,26,.06), 0 4px 16px rgba(20,22,26,.05);
  --shadow-lg: 0 12px 40px rgba(20,22,26,.18);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:        #0c0e10;
  --surface:     #17191c;
  --surface-2:   #1c1f22;
  --surface-3:   #23262a;
  --ink:         #f2f3ee;
  --ink-2:       #c3c2b7;
  --muted:       #8f8f88;
  --line:        #2c2f33;
  --line-strong: #3a3d42;
  --brand:       #2c4155;
  --brand-2:     #3a5470;
  --brand-ink:   #e9eef4;
  --accent:      #cbA968;
  --good:#0ca30c; --good-bg:#12331a;
  --warn:#e0a92a; --warn-bg:#3a2f12;
  --serious:#e0855a; --serious-bg:#3a2317;
  --crit:#e56060; --crit-bg:#3a1717;
  --info:#5598e7; --info-bg:#132539;
  --c1:#3987e5; --c2:#199e70; --c3:#c98500; --c4:#008300;
  --c5:#9085e9; --c6:#e66767; --c7:#d55181; --c8:#d95926;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.4);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--page); color: var(--ink); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1,h2,h3,h4 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
button { font-family: inherit; }
a { color: var(--focus); }
.app { display: flex; min-height: 100vh; }
.sidebar { width: 236px; flex-shrink: 0; background: var(--brand); color: var(--brand-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { padding: 18px 18px 14px; display: flex; gap: 11px; align-items: center; border-bottom: 1px solid rgba(255,255,255,.1); }
.brand .mark { width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0; background: linear-gradient(150deg, var(--accent), #8a6d2c); display: grid; place-items: center; font-weight: 800; color: #1c1a14; font-size: 16px; letter-spacing: -1px; }
.brand .bt { font-size: 15px; font-weight: 750; line-height: 1.1; }
.brand .bs { font-size: 11px; opacity: .72; letter-spacing: .04em; text-transform: uppercase; }
.unitbar { padding: 11px 18px; font-size: 12px; line-height: 1.35; border-bottom: 1px solid rgba(255,255,255,.1); opacity: .9; }
.unitbar .un { font-weight: 700; font-size: 13px; }
.nav { padding: 10px 10px; flex: 1; overflow-y: auto; }
.nav button { width: 100%; text-align: left; background: transparent; border: 0; color: var(--brand-ink); padding: 9px 12px; border-radius: 8px; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 10px; opacity: .82; margin-bottom: 2px; font-weight: 550; }
.nav button .ic { width: 18px; text-align: center; font-size: 15px; opacity: .9; }
.nav button:hover { background: rgba(255,255,255,.09); opacity: 1; }
.nav button.active { background: rgba(255,255,255,.16); opacity: 1; font-weight: 650; }
.nav button .badge { margin-left: auto; background: var(--crit); color: #fff; font-size: 10.5px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; display: grid; place-items: center; font-weight: 700; }
.sidefoot { padding: 12px 14px; border-top: 1px solid rgba(255,255,255,.1); font-size: 11px; opacity: .72; }
.sidefoot a { color: var(--brand-ink); opacity: .85; text-decoration: none; display: inline-flex; gap: 4px; align-items: center; }
.sidefoot a:hover { opacity: 1; text-decoration: underline; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 13px 22px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.topbar h2 { font-size: 18px; }
.topbar .sub { color: var(--muted); font-size: 12.5px; }
.topbar .spacer { flex: 1; }
.iconbtn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); height: 34px; border-radius: 8px; padding: 0 12px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; font-weight: 550; }
.iconbtn:hover { background: var(--surface-3); }
.iconbtn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.iconbtn.primary:hover { background: var(--brand-2); }
.iconbtn.sm { height: 29px; padding: 0 9px; font-size: 12px; }
.content { padding: 22px; max-width: 1340px; width: 100%; }
.grid { display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.card .hd { padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px; }
.card .hd h3 { font-size: 14px; }
.card .hd .spacer { flex: 1; }
.card .bd { padding: 0 16px 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi .lab { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 650; }
.kpi .val { font-size: 30px; font-weight: 730; letter-spacing: -0.02em; margin-top: 3px; line-height: 1; }
.kpi .val small { font-size: 15px; color: var(--muted); font-weight: 600; }
.kpi .sub { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.kpi .accentbar { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.kpi.good .accentbar { background: var(--good); } .kpi.warn .accentbar { background: var(--warn); }
.kpi.crit .accentbar { background: var(--crit); } .kpi.info .accentbar { background: var(--info); }
.kpi.brand .accentbar { background: var(--brand-2); } .kpi.serious .accentbar { background: var(--serious); }
.barrow { display: grid; grid-template-columns: 120px 1fr 44px; align-items: center; gap: 10px; margin: 7px 0; }
.barrow .bl { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bartrack { background: var(--surface-3); border-radius: 5px; height: 16px; overflow: hidden; display: flex; }
.barseg { height: 100%; }
.barval { font-size: 12px; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.alertlist { display: flex; flex-direction: column; gap: 1px; }
.alert { display: flex; align-items: flex-start; gap: 11px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
.alert:hover { background: var(--surface-2); }
.alert .pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 3px 7px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; margin-top: 1px; }
.alert .atxt { font-size: 13px; }
.alert .atxt .who { font-weight: 650; }
.alert .ameta { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.pill.crit { background: var(--crit-bg); color: var(--crit); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.serious { background: var(--serious-bg); color: var(--serious); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.good { background: var(--good-bg); color: var(--good); }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar input[type=search], .toolbar select, .field input, .field select, .field textarea { font-family: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; height: 34px; }
.toolbar input[type=search] { min-width: 200px; }
.toolbar .spacer { flex: 1; }
.field textarea { height: auto; min-height: 66px; resize: vertical; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; cursor: pointer; user-select: none; }
thead th.noSort { cursor: default; }
thead th .arrow { opacity: .5; font-size: 10px; }
tbody td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
.namecell { font-weight: 600; }
.mono { font-variant-numeric: tabular-nums; }
.rankchip { font-size: 11px; font-weight: 700; background: var(--surface-3); color: var(--ink-2); padding: 2px 6px; border-radius: 5px; letter-spacing: .02em; }
.statustag { font-size: 11.5px; font-weight: 650; padding: 3px 9px; border-radius: 20px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.statustag .sd { width: 7px; height: 7px; border-radius: 50%; }
.rowbtns { display: flex; gap: 4px; }
.rowbtn { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 14px; padding: 4px 6px; border-radius: 6px; }
.rowbtn:hover { background: var(--surface-3); color: var(--ink); }
.empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 13.5px; }
.empty .big { font-size: 30px; margin-bottom: 8px; opacity: .5; }
.rzcell { display: inline-flex; align-items: center; justify-content: center; min-width: 62px; padding: 3px 6px; border-radius: 6px; font-size: 11.5px; font-weight: 650; cursor: pointer; font-variant-numeric: tabular-nums; border: 1px solid transparent; }
.rz-good { background: var(--good-bg); color: var(--good); }
.rz-warn { background: var(--warn-bg); color: var(--warn); }
.rz-crit { background: var(--crit-bg); color: var(--crit); }
.rz-none { background: var(--surface-3); color: var(--muted); }
.rzcell:hover { border-color: var(--line-strong); }
.overlay { position: fixed; inset: 0; background: rgba(10,12,14,.5); backdrop-filter: blur(2px); display: none; align-items: flex-start; justify-content: center; z-index: 100; padding: 40px 16px; overflow-y: auto; }
.overlay.show { display: flex; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); width: 100%; max-width: 580px; border: 1px solid var(--line); }
.modal.wide { max-width: 840px; }
.modal .mh { padding: 17px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal .mh h3 { font-size: 16px; }
.modal .mh .x { margin-left: auto; border: 0; background: transparent; font-size: 20px; cursor: pointer; color: var(--muted); line-height: 1; }
.modal .mb { padding: 18px 20px; }
.modal .mf { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; background: var(--surface-2); border-radius: 0 0 14px 14px; flex-wrap: wrap; }
.formgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field label .req { color: var(--crit); }
.field .hint { font-size: 11px; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; height: auto; min-height: 34px; }
.settings-sec { margin-bottom: 22px; }
.settings-sec > h3 { font-size: 15px; margin-bottom: 3px; }
.settings-sec > .desc { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.chip { background: var(--surface-3); border: 1px solid var(--line); border-radius: 20px; padding: 4px 8px 4px 11px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.chip .cdot { width: 9px; height: 9px; border-radius: 50%; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; padding: 0; }
.chip button:hover { color: var(--crit); }
.miniform { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: end; }
.miniform .field { gap: 3px; }
.miniform input, .miniform select { height: 32px; }
.reqtable input, .reqtable select { height: 30px; font-size: 12.5px; padding: 4px 7px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.toggle input { width: 16px; height: 16px; }
.banner { background: var(--warn-bg); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); padding: 10px 13px; border-radius: 9px; font-size: 12.5px; display: flex; gap: 9px; align-items: flex-start; margin-bottom: 16px; }
.banner.info { background: var(--info-bg); color: var(--info); border-color: color-mix(in srgb, var(--info) 30%, transparent); }
.segbtns { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.segbtns button { border: 0; background: var(--surface); padding: 7px 13px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); border-right: 1px solid var(--line-strong); }
.segbtns button:last-child { border-right: 0; }
.segbtns button.active { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
.detail-grid .dl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.detail-grid .dv { font-size: 13.5px; margin-bottom: 8px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; margin: 18px 0 8px; }
.timeline { display: flex; flex-direction: column; gap: 8px; }
.tl-item { display: flex; gap: 10px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tl-item:last-child { border-bottom: 0; }
.tl-date { color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 82px; font-variant-numeric: tabular-nums; }
.tl-type { font-weight: 650; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--page); padding: 11px 18px; border-radius: 9px; font-size: 13px; box-shadow: var(--shadow-lg); opacity: 0; transition: .2s; z-index: 200; pointer-events: none; font-weight: 550; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.help { font-size: 12.5px; color: var(--muted); }
.blurred { filter: blur(5px); user-select: none; transition: filter .12s; }
.confbadge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--crit); background: var(--crit-bg); padding: 2px 6px; border-radius: 5px; margin-left: 6px; }
@media (max-width: 880px) {
  .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: .2s; z-index: 90; box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: translateX(0); }
  .menu-toggle { display: inline-flex !important; }
  .formgrid, .detail-grid { grid-template-columns: 1fr; }
  .content { padding: 16px; }
}
.menu-toggle { display: none; }
@media print { .sidebar, .topbar, .toolbar, .rowbtns, .iconbtn { display: none !important; } .content { padding: 0; } .blurred { filter: none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">RC</div>
      <div><div class="bt">RodChiron</div><div class="bs">Group Command Deck</div></div>
    </div>
    <div class="unitbar" id="unitbar"></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <a href="index.html">◂ Company Deck</a><br>
      <span style="opacity:.7">Group build • v1.0</span><br><span id="lastsaved"></span>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="iconbtn sm menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
      <div><h2 id="viewTitle">Dashboard</h2><div class="sub" id="viewSub"></div></div>
      <div class="spacer"></div>
      <div id="topActions"></div>
      <button class="iconbtn sm" id="themeBtn" title="Toggle theme">◐</button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================ Data layer ============================ */
const STORAGE_KEY = "rodchiron_group_v1";

const todayISO = () => new Date().toISOString().slice(0,10);

  careStatuses: [

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return BLANK_DB();
    const parsed = JSON.parse(raw);
    const base = BLANK_DB();
    parsed.settings = Object.assign({}, base.settings, parsed.settings || {});
    parsed.cases = parsed.cases || [];
    return Object.assign(base, parsed);
  } catch (e) { console.error("Load failed", e); return BLANK_DB(); }
}
function save() {
  DB.savedAt = new Date().toISOString();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch (e) { toast("⚠ Could not save (storage full?)"); }
  renderLastSaved();
}

/* ============================ Utilities ============================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function addDays(iso, n) { const d = new Date(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtDate(iso) { if (!iso) return "—"; const d = new Date(iso+"T00:00:00"); return d.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"}); }
function fmtShort(iso) { if (!iso) return "—"; const d = new Date(iso+"T00:00:00"); return d.toLocaleDateString(undefined, {month:"short", day:"numeric"}); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 2400); }
const S = () => DB.settings;
const soldierName = (s) => s ? `${s.rank||""} ${s.lastName||""}, ${s.firstName||""}`.trim() : "—";
const soldierShort = (s) => s ? `${s.lastName}, ${(s.firstName||"").slice(0,1)}.` : "—";
function getReq(id){ return S().requirements.find(r=>r.id===id); }
function getStatusDef(id){ return S().dutyStatuses.find(d=>d.id===id) || S().dutyStatuses[0]; }
function getUnit(id){ return S().units.find(u=>u.id===id); }
function unitName(id){ const u=getUnit(id); return u?u.name:"Unassigned"; }
function getCareType(id){ return S().careTypes.find(t=>t.id===id) || {name:"—", color:"#888", highRisk:false}; }
function getSeverity(id){ return S().careSeverities.find(x=>x.id===id) || {name:"—", color:"#888", weight:0}; }
function getCareStatus(id){ return S().careStatuses.find(x=>x.id===id) || {name:"—", resolved:false}; }
function getResource(id){ return S().resources.find(x=>x.id===id); }

function readinessOf(soldier, req) {
  const last = (soldier.readiness && soldier.readiness[req.id]) || null;
  if (!last) return { level:"none", due:null, days:null, last:null };
  const due = addDays(last, req.cycleDays);
  const days = daysBetween(todayISO(), due);
  let level = "good";
  if (days < 0) level = "crit"; else if (days <= req.amberDays) level = "warn";
  return { level, due, days, last };
}
function activeReqs(){ return S().requirements.filter(r=>r.active); }
function soldierReadinessLevel(soldier) {
  let worst = "good", hasAny = false;
  for (const req of activeReqs()) {
    const r = readinessOf(soldier, req); hasAny = true;
    if (r.level === "crit" || r.level === "none") return "crit";
    if (r.level === "warn") worst = "warn";
  }
  return hasAny ? worst : "good";
}
/* care: soldier risk = max severity weight among open (unresolved) cases */
function openCases(soldierId){ return DB.cases.filter(c => c.soldierId===soldierId && !getCareStatus(c.statusId).resolved); }
function soldierRiskWeight(soldierId) {
  let w = 0;
  for (const c of openCases(soldierId)) {
    const sw = getSeverity(c.severityId).weight;
    if (sw > w) w = sw;
    if (getCareType(c.typeId).highRisk && sw < 3) w = Math.max(w, 3);
  }
  return w;
}
function riskLabel(w){ return w>=4?{t:"CRITICAL",c:"var(--crit)"}:w>=3?{t:"HIGH",c:"var(--serious)"}:w>=2?{t:"MOD",c:"var(--warn)"}:w>=1?{t:"LOW",c:"var(--good)"}:{t:"—",c:"var(--muted)"}; }

/* ============================ Alerts engine ============================ */
function computeAlerts() {
  const out = [];
  const warnDays = S().suspenseWarnDays, careWarn = S().careFollowWarnDays;
  for (const s of DB.soldiers) {
    const def = getStatusDef(s.dutyStatus);
    if (def.id === "awol") out.push({ sev:"crit", cat:"Accountability", who:soldierName(s), text:"AWOL / Unaccounted for", meta:unitName(s.unitId), sort:0, view:"accountability" });
  }
  for (const s of DB.soldiers) for (const req of activeReqs()) {
    const r = readinessOf(s, req);
    if (r.level === "crit" && r.last) out.push({ sev:"crit", cat:"Readiness", who:soldierName(s), text:`${req.name} EXPIRED`, meta:unitName(s.unitId)+" · due "+fmtShort(r.due), sort:5+r.days/1000, view:"readiness" });
    else if (r.level === "warn") out.push({ sev:"warn", cat:"Readiness", who:soldierName(s), text:`${req.name} expiring`, meta:`${r.days}d`, sort:30+r.days, view:"readiness" });
  }
  for (const t of DB.tasks) {
    if (t.status === "Complete" || !t.dueDate) continue;
    const d = daysBetween(todayISO(), t.dueDate);
    const who = t.assignedTo ? soldierName(DB.soldiers.find(s=>s.id===t.assignedTo)) : (t.assignedText || "Group");
    if (d < 0) out.push({ sev:"crit", cat:"Suspense", who:t.title, text:`Overdue ${Math.abs(d)}d`, meta:who, sort:2+d/1000, view:"suspenses" });
    else if (d <= warnDays) out.push({ sev:"warn", cat:"Suspense", who:t.title, text:`Due in ${d}d`, meta:who, sort:20+d, view:"suspenses" });
  }
  for (const c of DB.cases) {
    if (getCareStatus(c.statusId).resolved) continue;
    const s = DB.soldiers.find(x=>x.id===c.soldierId);
    const who = s ? soldierName(s) : "(removed)";
    const type = getCareType(c.typeId);
    const sev = getSeverity(c.severityId);
    const label = c.sensitive && !revealSensitive ? "Confidential case" : type.name;
    if (sev.weight>=4 || (type.highRisk && sev.weight>=3))
      out.push({ sev:"crit", cat:"Care", who, text:`${sev.name} — ${label}`, meta:unitName(s&&s.unitId), sort:1+ (10-sev.weight)/100, view:"care" });
    if (c.followUp) {
      const d = daysBetween(todayISO(), c.followUp);
      if (d < 0) out.push({ sev:"crit", cat:"Care", who, text:`Follow-up overdue ${Math.abs(d)}d`, meta:label, sort:3+d/1000, view:"care" });
      else if (d <= careWarn) out.push({ sev:"warn", cat:"Care", who, text:`Follow-up in ${d}d`, meta:label, sort:22+d, view:"care" });
    }
  }
  out.sort((a,b) => (a.sev===b.sev ? a.sort-b.sort : (a.sev==="crit"?-1:1)));
  return out;
}

/* ============================ Dashboard ============================ */
function renderDashboard(c) {
  const soldiers = DB.soldiers, total = soldiers.length;
  const present = soldiers.filter(s => getStatusDef(s.dutyStatus).present).length;
  const presentPct = total ? Math.round(present/total*100) : 0;
  const redRdy = soldiers.filter(s => soldierReadinessLevel(s) === "crit").length;
  const overdue = DB.tasks.filter(t => t.status!=="Complete" && t.dueDate && daysBetween(todayISO(),t.dueDate) < 0).length;
  const openCase = DB.cases.filter(x=>!getCareStatus(x.statusId).resolved).length;
  const highRisk = soldiers.filter(s => soldierRiskWeight(s.id) >= 3).length;
  const followDue = DB.cases.filter(x=>!getCareStatus(x.statusId).resolved && x.followUp && daysBetween(todayISO(),x.followUp) <= S().careFollowWarnDays).length;
  const alerts = computeAlerts();

  $("#viewSub").textContent = `${S().group.name} • ${total} Soldiers across ${S().units.length} units • ${new Date().toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric", year:"numeric"})}`;
  $("#topActions").innerHTML = `<button class="iconbtn" data-act="add-soldier">＋ Soldier</button>
    <button class="iconbtn" data-act="add-case">＋ Case</button>
    <button class="iconbtn" data-act="print">⎙ Print</button>`;

  if (total === 0) {
    c.innerHTML = emptyState("👥","No personnel on the roster yet",
      "Add a Soldier, import your Company deck roster, or load a demo battalion to explore.",
      `<button class="iconbtn primary" data-act="add-soldier">＋ Add Soldier</button>
       <button class="iconbtn" data-act="import-company">⭱ Import Company deck</button>
       <button class="iconbtn" data-act="seed-demo">Load demo battalion</button>`);
    return;
  }

  const kpis = `<div class="kpis">
    ${kpiTile("brand","Assigned", total, `${present} present · ${S().units.length} units`)}
    ${kpiTile(presentPct>=90?"good":presentPct>=75?"warn":"crit","Present %", presentPct+"<small>%</small>", `${present} of ${total} on duty`)}
    ${kpiTile(redRdy?"crit":"good","Readiness — Red", redRdy, "Soldiers with expired items")}
    ${kpiTile(highRisk?"serious":"good","High-Risk Soldiers", highRisk, "open High/Critical cases")}
    ${kpiTile(openCase?"info":"good","Open Care Cases", openCase, `${followDue} follow-ups due`)}
    ${kpiTile(overdue?"crit":"good","Overdue Suspenses", overdue, "past due")}
  </div>`;

  // Unit roll-up
  const unitRows = S().units.map(u => {
    const list = soldiers.filter(s=>s.unitId===u.id);
    const n = list.length;
    const pres = list.filter(s=>getStatusDef(s.dutyStatus).present).length;
    const red = list.filter(s=>soldierReadinessLevel(s)==="crit").length;
    const hr = list.filter(s=>soldierRiskWeight(s.id)>=3).length;
    return { u, n, pres, red, hr };
  });
  const unassigned = soldiers.filter(s=>!getUnit(s.unitId));
  if (unassigned.length) unitRows.push({ u:{id:"",name:"Unassigned"}, n:unassigned.length,
    pres:unassigned.filter(s=>getStatusDef(s.dutyStatus).present).length,
    red:unassigned.filter(s=>soldierReadinessLevel(s)==="crit").length,
    hr:unassigned.filter(s=>soldierRiskWeight(s.id)>=3).length });

  const unitTable = `<div class="tablewrap" style="box-shadow:none;border:0"><table>
    <thead><tr><th class="noSort">Unit</th><th class="noSort">Asgd</th><th class="noSort">Present</th><th class="noSort">Rdy Red</th><th class="noSort">High-Risk</th><th class="noSort">Strength</th></tr></thead>
    <tbody>${unitRows.map(r=>{
      const pct = r.n?Math.round(r.pres/r.n*100):0;
      return `<tr><td class="namecell">${esc(r.u.name)}</td><td class="mono">${r.n}</td>
        <td class="mono">${r.pres} <span class="help">(${pct}%)</span></td>
        <td class="mono" style="${r.red?'color:var(--crit);font-weight:650':''}">${r.red}</td>
        <td class="mono" style="${r.hr?'color:var(--serious);font-weight:650':''}">${r.hr}</td>
        <td><div class="bartrack" style="width:120px"><div class="barseg" style="width:${pct}%;background:${pct>=90?'var(--good)':pct>=75?'var(--warn)':'var(--crit)'}"></div></div></td></tr>`;
    }).join("")}</tbody></table></div>`;

  // Care cases by type
  const typeCounts = {};
  for (const cs of DB.cases) if(!getCareStatus(cs.statusId).resolved) typeCounts[cs.typeId]=(typeCounts[cs.typeId]||0)+1;
  const careBars = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([tid,n])=>{ const t=getCareType(tid); return barRow(t.name, n, Math.max(1,openCase), t.color); }).join("") || `<div class="empty">No open cases.</div>`;

  const alertHtml = alerts.length ? alerts.slice(0,16).map(a => `
    <div class="alert" data-nav="${a.view}"><span class="pill ${a.sev}">${a.cat}</span>
      <div class="atxt"><span class="who">${esc(a.who)}</span> — ${esc(a.text)}
        ${a.meta?`<div class="ameta">${esc(a.meta)}</div>`:""}</div></div>`).join("")
    : `<div class="empty"><div class="big">✓</div>All clear — no active flags.</div>`;

  c.innerHTML = `${kpis}
    <div class="grid" style="grid-template-columns: 1.2fr 1fr; margin-top:16px;">
      <div class="card"><div class="hd"><h3>Unit Roll-up</h3><div class="spacer"></div><span class="help">${S().units.length} subordinate units</span></div>
        <div class="bd">${unitTable}</div></div>
      <div class="card"><div class="hd"><h3>Open Care Cases by Type</h3><div class="spacer"></div><span class="help">${openCase} open</span></div>
        <div class="bd">${careBars}</div></div>
    </div>
    <div class="grid" style="grid-template-columns: 1fr; margin-top:16px;">
      <div class="card"><div class="hd"><h3>Command Alerts</h3><div class="spacer"></div><span class="help">${alerts.length} flagged</span></div>
        <div class="bd"><div class="alertlist">${alertHtml}</div></div></div>
    </div>`;
}
function kpiTile(kind, label, val, sub) {
  return `<div class="kpi ${kind}"><div class="accentbar"></div><div class="lab">${label}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
}
function barRow(label, val, total, color) {
  const pct = total ? (val/total*100) : 0;
  return `<div class="barrow"><div class="bl" title="${esc(label)}">${esc(label)}</div>
    <div class="bartrack"><div class="barseg" style="width:${pct}%;background:${color}"></div></div><div class="barval">${val}</div></div>`;
}
function emptyState(icon, title, msg, actions="") {

let rosterState = { q:"", unit:"", status:"", risk:"", sort:"lastName", dir:1 };
function renderRoster(c) {
  $("#viewSub").textContent = `${DB.soldiers.length} Soldiers across ${S().units.length} units`;
  $("#topActions").innerHTML = `<button class="iconbtn primary" data-act="add-soldier">＋ Add Soldier</button>`;
  const unitOpts = `<option value="">All units</option>` + S().units.map(u=>`<option value="${u.id}"${u.id===rosterState.unit?" selected":""}>${esc(u.name)}</option>`).join("") + `<option value="__none"${rosterState.unit==="__none"?" selected":""}>Unassigned</option>`;
  const statOpts = `<option value="">All statuses</option>` + S().dutyStatuses.map(d=>`<option value="${d.id}"${d.id===rosterState.status?" selected":""}>${esc(d.name)}</option>`).join("");

  let rows = DB.soldiers.filter(s => {
    if (rosterState.unit==="__none") { if (getUnit(s.unitId)) return false; }
    else if (rosterState.unit && s.unitId !== rosterState.unit) return false;
    if (rosterState.status && s.dutyStatus !== rosterState.status) return false;
    if (rosterState.risk==="high" && soldierRiskWeight(s.id) < 3) return false;
    if (rosterState.q) { const hay = `${s.lastName} ${s.firstName} ${s.rank} ${s.mos} ${unitName(s.unitId)}`.toLowerCase();
      if (!hay.includes(rosterState.q.toLowerCase())) return false; }
    return true;
  });
  rows.sort((a,b) => {
    let av = rosterState.sort==="unitId"?unitName(a.unitId):(a[rosterState.sort]||"");
    let bv = rosterState.sort==="unitId"?unitName(b.unitId):(b[rosterState.sort]||"");
    return String(av).localeCompare(String(bv)) * rosterState.dir;
  });
  const th = (key,label) => `<th data-sort="${key}">${label} ${rosterState.sort===key?`<span class="arrow">${rosterState.dir>0?"▲":"▼"}</span>`:""}</th>`;

  const body = rows.length ? rows.map(s => {
    const def = getStatusDef(s.dutyStatus);
    const rl = soldierReadinessLevel(s);
    const rlColor = {good:"var(--good)", warn:"var(--warn)", crit:"var(--crit)"}[rl];
    const rlLabel = {good:"GREEN", warn:"AMBER", crit:"RED"}[rl];
    const rw = soldierRiskWeight(s.id), rk = riskLabel(rw);
    const oc = openCases(s.id).length;
    return `<tr data-soldier="${s.id}">
      <td class="namecell">${esc(soldierName(s))}</td>
      <td><span class="rankchip">${esc(s.rank||"—")}</span></td>
      <td>${esc(unitName(s.unitId))}</td>
      <td><span class="statustag" style="background:${def.color}1a;color:${def.color}"><span class="sd" style="background:${def.color}"></span>${esc(def.name)}</span></td>
      <td><span class="statustag" style="background:${rlColor}1a;color:${rlColor}"><span class="sd" style="background:${rlColor}"></span>${rlLabel}</span></td>
      <td><span class="statustag" style="background:${rk.c}1a;color:${rk.c}">${rk.t}${oc?` · ${oc}`:""}</span></td>
      <td><div class="rowbtns">
        <button class="rowbtn" data-view-soldier="${s.id}" title="Details">◔</button>
        <button class="rowbtn" data-edit-soldier="${s.id}" title="Edit">✎</button>
        <button class="rowbtn" data-del-soldier="${s.id}" title="Remove">✕</button></div></td></tr>`;
  }).join("") : `<tr><td colspan="7" class="empty">No Soldiers match your filters.</td></tr>`;

  c.innerHTML = `
    <div class="toolbar">
      <input type="search" id="rosterSearch" placeholder="Search name, MOS, unit…" value="${esc(rosterState.q)}">
      <select id="rosterUnit">${unitOpts}</select>
      <select id="rosterStat">${statOpts}</select>
      <div class="segbtns">
        <button class="${rosterState.risk===""?"active":""}" data-riskf="">All</button>
        <button class="${rosterState.risk==="high"?"active":""}" data-riskf="high">High-Risk</button>
      </div>
      <div class="spacer"></div><span class="help">${rows.length} shown</span>
    </div>
    <div class="tablewrap"><table>
      <thead><tr>${th("lastName","Name")}${th("rank","Rank")}${th("unitId","Unit")}${th("dutyStatus","Duty")}
        <th class="noSort">Readiness</th><th class="noSort">Risk / Cases</th><th class="noSort"></th></tr></thead>
      <tbody>${body}</tbody></table></div>`;

  $("#rosterSearch").addEventListener("input", e => { rosterState.q = e.target.value; debouncedRoster(); });

  $("#topActions").innerHTML = `<button class="iconbtn" data-act="print">⎙ Print</button><button class="iconbtn" data-nav="settings">⚙ Configure</button>`;

  if (!reqs.length) { c.innerHTML = emptyState("✓","No active requirements","Enable requirements in Settings.",`<button class="iconbtn primary" data-nav="settings">Open Settings</button>`); return; }

  const head = `<tr><th style="position:sticky;left:0;background:var(--surface-2);z-index:2">Soldier</th><th class="noSort">Unit</th>
    ${reqs.map(req=>`<th class="noSort" style="text-align:center" title="${esc(req.name)}">${esc(req.abbr)}</th>`).join("")}</tr>`;
  const body = DB.soldiers.slice().sort((a,b)=>(a.lastName||"").localeCompare(b.lastName||"")).map(s => {

      return `<td style="text-align:center"><span class="rzcell ${cls}" data-rdy-edit="${s.id}|${req.id}" title="${esc(tip)}">${txt}</span></td>`;
    }).join("");
    return `<tr><td class="namecell" style="position:sticky;left:0;background:var(--surface)">${esc(soldierShort(s))}</td><td class="help">${esc(unitName(s.unitId))}</td>${cells}</tr>`;

function quickReadiness(sid, rid) {

/* ============================ Care & Cases ============================ */
let careTab = "open";
function renderCare(c) {
  const openN = DB.cases.filter(x=>!getCareStatus(x.statusId).resolved).length;
  const highN = DB.cases.filter(x=>!getCareStatus(x.statusId).resolved && (getSeverity(x.severityId).weight>=3 || getCareType(x.typeId).highRisk)).length;
  const followN = DB.cases.filter(x=>!getCareStatus(x.statusId).resolved && x.followUp && daysBetween(todayISO(),x.followUp) <= S().careFollowWarnDays).length;
  const resolvedN = DB.cases.filter(x=>getCareStatus(x.statusId).resolved).length;
  $("#viewSub").textContent = `${openN} open · ${highN} high-risk · ${followN} follow-ups due`;
  $("#topActions").innerHTML = `<button class="iconbtn ${revealSensitive?"primary":""}" data-reveal>${revealSensitive?"🔓 Hide sensitive":"🔒 Reveal sensitive"}</button>
    <button class="iconbtn primary" data-act="add-case">＋ New Case</button>`;

  if (!DB.soldiers.length) { c.innerHTML = emptyState("♥","No personnel yet","Add Soldiers before opening care cases.",`<button class="iconbtn primary" data-act="add-soldier">＋ Add Soldier</button>`); return; }

  let cases = DB.cases.slice();
  if (careTab==="open") cases = cases.filter(x=>!getCareStatus(x.statusId).resolved);
  else if (careTab==="high") cases = cases.filter(x=>!getCareStatus(x.statusId).resolved && (getSeverity(x.severityId).weight>=3 || getCareType(x.typeId).highRisk));
  else if (careTab==="follow") cases = cases.filter(x=>!getCareStatus(x.statusId).resolved && x.followUp);
  else if (careTab==="resolved") cases = cases.filter(x=>getCareStatus(x.statusId).resolved);
  cases.sort((a,b)=>{
    const wa=getSeverity(a.severityId).weight, wb=getSeverity(b.severityId).weight;
    if (wa!==wb) return wb-wa;
    return (a.followUp||"9999").localeCompare(b.followUp||"9999");
  });

  const rows = cases.length ? cases.map(cs => {
    const s = DB.soldiers.find(x=>x.id===cs.soldierId);
    const t = getCareType(cs.typeId), sev = getSeverity(cs.severityId), st = getCareStatus(cs.statusId);
    const hide = cs.sensitive && !revealSensitive;
    const title = hide ? "•••• confidential" : (cs.title || "—");
    const fd = cs.followUp ? daysBetween(todayISO(), cs.followUp) : null;
    const fdOver = !st.resolved && fd!=null && fd<0;
    return `<tr data-view-case="${cs.id}">
      <td class="namecell">${esc(s?soldierName(s):"(removed)")}<div class="help">${esc(unitName(s&&s.unitId))}</div></td>
      <td><span class="statustag" style="background:${t.color}1a;color:${t.color}"><span class="sd" style="background:${t.color}"></span>${esc(t.name)}</span>${cs.sensitive?'<span class="confbadge">conf</span>':''}</td>
      <td><span class="statustag" style="background:${sev.color}1a;color:${sev.color}">${esc(sev.name)}</span></td>
      <td class="${hide?"blurred":""}" style="max-width:260px">${esc(title)}</td>
      <td><span class="pill ${st.resolved?"good":"info"}">${esc(st.name)}</span></td>
      <td class="mono" style="${fdOver?'color:var(--crit);font-weight:650':''}">${cs.followUp?(st.resolved?fmtShort(cs.followUp):(fdOver?`${Math.abs(fd)}d over`:`${fd}d`)):"—"}</td>
      <td><div class="rowbtns"><button class="rowbtn" data-edit-case="${cs.id}">✎</button><button class="rowbtn" data-del-case="${cs.id}">✕</button></div></td></tr>`;
  }).join("") : `<tr><td colspan="7" class="empty">No cases in this view.</td></tr>`;

  c.innerHTML = `
    <div class="banner info">♥ <b>Soldier Care:</b> track life & personal issues, referrals, and follow-ups. Mark a case <b>Confidential</b> to blur its details until you choose <b>Reveal sensitive</b>. Handle in accordance with your privacy and medical-information rules.</div>
    <div class="toolbar">
      <div class="segbtns">
        <button class="${careTab==="open"?"active":""}" data-caretab="open">Open (${openN})</button>
        <button class="${careTab==="high"?"active":""}" data-caretab="high">High-Risk (${highN})</button>
        <button class="${careTab==="follow"?"active":""}" data-caretab="follow">Follow-ups</button>
        <button class="${careTab==="resolved"?"active":""}" data-caretab="resolved">Resolved (${resolvedN})</button>
        <button class="${careTab==="all"?"active":""}" data-caretab="all">All</button>
      </div>
      <div class="spacer"></div><span class="help">${cases.length} shown</span>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th class="noSort">Soldier</th><th class="noSort">Type</th><th class="noSort">Severity</th><th class="noSort">Summary</th><th class="noSort">Status</th><th class="noSort">Follow-up</th><th class="noSort"></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  $$("[data-caretab]",c).forEach(b=>b.addEventListener("click",()=>{ careTab=b.dataset.caretab; renderCare(c); }));

/* ============================ Suspenses ============================ */
let suspFilter = "open";
function renderSuspenses(c) {
  $("#viewSub").textContent = `${DB.tasks.filter(t=>t.status!=="Complete").length} open taskers`;
  $("#topActions").innerHTML = `<button class="iconbtn primary" data-act="add-task">＋ New Suspense</button>`;
  let tasks = DB.tasks.slice();
  if (suspFilter==="open") tasks = tasks.filter(t=>t.status!=="Complete");
  else if (suspFilter==="overdue") tasks = tasks.filter(t=>t.status!=="Complete" && t.dueDate && daysBetween(todayISO(),t.dueDate)<0);
  else if (suspFilter==="done") tasks = tasks.filter(t=>t.status==="Complete");
  tasks.sort((a,b)=>(a.dueDate||"9999").localeCompare(b.dueDate||"9999"));
  const prColor = { Immediate:"var(--crit)", Priority:"var(--warn)", Routine:"var(--info)" };
  const body = tasks.length ? tasks.map(t => {
    const d = t.dueDate ? daysBetween(todayISO(),t.dueDate) : null;
    const overdue = t.status!=="Complete" && d!=null && d<0;
    const who = t.assignedTo ? soldierShort(DB.soldiers.find(s=>s.id===t.assignedTo)) : (t.assignedText||"Group");
    const dueTxt = t.dueDate ? (t.status==="Complete"?fmtShort(t.dueDate):(overdue?`${Math.abs(d)}d overdue`:d===0?"Today":`${d}d`)) : "—";
    return `<tr><td class="namecell">${esc(t.title)}${t.notes?`<div class="help">${esc(t.notes)}</div>`:""}</td>
      <td>${esc(t.category||"—")}</td><td>${esc(who)}</td>
      <td><span class="statustag" style="background:${prColor[t.priority]||"var(--surface-3)"}1a;color:${prColor[t.priority]||"var(--muted)"}">${esc(t.priority||"—")}</span></td>
      <td class="mono" style="${overdue?"color:var(--crit);font-weight:650":""}">${dueTxt}<div class="help">${fmtShort(t.dueDate)}</div></td>
      <td><select data-taskstatus="${t.id}" style="height:28px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:12px">
        ${["Open","In Progress","Complete"].map(st=>`<option${st===t.status?" selected":""}>${st}</option>`).join("")}</select></td>
      <td><div class="rowbtns"><button class="rowbtn" data-edit-task="${t.id}">✎</button><button class="rowbtn" data-del-task="${t.id}">✕</button></div></td></tr>`;
  }).join("") : `<tr><td colspan="7" class="empty">No suspenses in this view.</td></tr>`;
  c.innerHTML = `<div class="toolbar">
      <div class="segbtns">${["open","overdue","done","all"].map(f=>`<button class="${f===suspFilter?"active":""}" data-suspfilter="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join("")}</div>
      <div class="spacer"></div><span class="help">Warn window: ${S().suspenseWarnDays} days</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th class="noSort">Tasker</th><th class="noSort">Category</th><th class="noSort">Assigned</th><th class="noSort">Priority</th><th class="noSort">Due</th><th class="noSort">Status</th><th class="noSort"></th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
  $$("[data-suspfilter]",c).forEach(b=>b.addEventListener("click",()=>{ suspFilter=b.dataset.suspfilter; renderSuspenses(c); }));
  $$("[data-taskstatus]",c).forEach(sel=>sel.addEventListener("change",()=>{ const t=DB.tasks.find(x=>x.id===sel.dataset.taskstatus); if(t){t.status=sel.value; save(); render(); }}));
}
function taskForm(existing) {
  const t = existing || { priority:"Routine", status:"Open", dueDate:"" };
  const solOpts = `<option value="">— Group / other —</option>` + DB.soldiers.slice().sort((a,b)=>(a.lastName||"").localeCompare(b.lastName||"")).map(s=>`<option value="${s.id}"${s.id===t.assignedTo?" selected":""}>${esc(soldierName(s))}</option>`).join("");
  const body = `<div class="formgrid">
    <div class="field full"><label>Tasker / suspense <span class="req">*</span></label><input id="t_title" value="${esc(t.title||"")}"></div>
    <div class="field"><label>Category</label><input id="t_cat" value="${esc(t.category||"")}" placeholder="Training, Admin, Supply…"></div>
    <div class="field"><label>Priority</label><select id="t_pr">${["Routine","Priority","Immediate"].map(p=>`<option${p===t.priority?" selected":""}>${p}</option>`).join("")}</select></div>
    <div class="field"><label>Assign to Soldier</label><select id="t_sol">${solOpts}</select></div>
    <div class="field"><label>…or free text</label><input id="t_soltext" value="${esc(t.assignedText||"")}" placeholder="A Co, S1, etc."></div>
    <div class="field"><label>Due date</label><input type="date" id="t_due" value="${esc(t.dueDate||"")}"></div>
    <div class="field"><label>Status</label><select id="t_status">${["Open","In Progress","Complete"].map(st=>`<option${st===t.status?" selected":""}>${st}</option>`).join("")}</select></div>
    <div class="field full"><label>Notes</label><textarea id="t_notes">${esc(t.notes||"")}</textarea></div></div>`;
  openModal(existing?"Edit Suspense":"New Suspense", body, [
    { label:"Cancel", cls:"", act:closeModal },

      const title=$("#t_title").value.trim(); if(!title){toast("Title required");return;}
      const rec = existing || { id:uid("task") };

    </div></div>
    <div class="help" style="text-align:center;margin:18px 0">RodChiron Group Command Deck · standalone build · your data never leaves this device.</div>`;
}
function chipList(arr, kind) {
  return arr.map(v=>`<span class="chip">${esc(v)} <button data-delchip="${kind}|${esc(v)}">✕</button></span>`).join("") || `<span class="help">None</span>`;
}
function saveReqsFromDOM() {
  $$("#reqBody tr[data-req]").forEach(tr => {
    const req = getReq(tr.dataset.req); if(!req) return;
    req.active = $("[data-rq-active]", tr).checked;
    req.name = $("[data-rq-name]", tr).value.trim() || req.name;
    req.abbr = ($("[data-rq-abbr]", tr).value.trim() || req.abbr).toUpperCase();
    req.cycleDays = Math.max(1, parseInt($("[data-rq-cycle]", tr).value)||req.cycleDays);
    req.amberDays = Math.max(0, parseInt($("[data-rq-amber]", tr).value)||0);
  });
}
function saveStatusesFromDOM() {
  $$('#statusList [data-status]').forEach(row => {
    const def = getStatusDef(row.dataset.status); if(!def) return;
    def.name = $("[data-ds-name]",row).value.trim() || def.name;
    def.color = $("[data-ds-color]",row).value;
    def.present = $("[data-ds-present]",row).checked;

function saveUnitsFromDOM() {
  $$('#unitList [data-unit]').forEach(row => {

function saveCareTypesFromDOM() {
  $$('#careTypeList [data-caretype]').forEach(row => {
    const t = getCareType(row.dataset.caretype); if(!t.id) return;

function saveCareStatusesFromDOM() {

/* ============================ Modal ============================ */
function openModal(title, bodyHtml, buttons, extraCls="") {
  const m = $("#modal"); m.className = "modal " + extraCls;
  m.innerHTML = `<div class="mh"><h3>${esc(title)}</h3><button class="x" data-close>×</button></div>
    <div class="mb">${bodyHtml}</div>
    <div class="mf">${buttons.map((b,i)=>`<button class="iconbtn ${b.cls}" data-mbtn="${i}">${esc(b.label)}</button>`).join("")}</div>`;
  m._buttons = buttons;
  $("#overlay").classList.add("show");
  const first = m.querySelector("input,select,textarea"); if (first) setTimeout(()=>first.focus(),40);
}
function closeModal() { $("#overlay").classList.remove("show"); $("#modal").innerHTML = ""; }

/* ============================ Import / Export ============================ */
function exportBackup() {
  downloadBlob(new Blob([JSON.stringify(DB, null, 2)], { type:"application/json" }), `rodchiron-group-backup-${todayISO()}.json`);
  toast("Backup exported");
}
function exportCSV() {
  const reqs = activeReqs();
  const head = ["Rank","Last","First","MOS","Unit","DutyStatus","Readiness","Risk","OpenCases", ...reqs.map(r=>r.abbr+" due")];
  const rows = DB.soldiers.map(s => {
    const def = getStatusDef(s.dutyStatus);
    return [s.rank, s.lastName, s.firstName, s.mos, unitName(s.unitId), def.name, soldierReadinessLevel(s).toUpperCase(),
      riskLabel(soldierRiskWeight(s.id)).t, openCases(s.id).length, ...reqs.map(r=>{const x=readinessOf(s,r); return x.due||"";})];
  });
  const csv = [head, ...rows].map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\n");
  downloadBlob(new Blob([csv],{type:"text/csv"}), `group-roster-${todayISO()}.csv`);
  toast("Roster CSV exported");
}
function downloadBlob(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.soldiers)) throw new Error("bad");
      confirmModal("Import backup?", `Replace all current data with this backup (${data.soldiers.length} Soldiers)?`, () => {
        DB = Object.assign(BLANK_DB(), data);
        DB.settings = Object.assign(DEFAULT_SETTINGS(), data.settings||{});
        DB.cases = DB.cases || [];
        save(); applyTheme(); render(); toast("Backup imported");
      });
    } catch (e) { toast("⚠ Invalid backup file"); }
  };
  reader.readAsText(file);
}
function importFromCompany() {
  let raw;
  try { raw = localStorage.getItem(COMPANY_KEY); } catch(e) {}
  if (!raw) { toast("No Company deck data found in this browser"); return; }
  let co; try { co = JSON.parse(raw); } catch(e) { toast("Company data unreadable"); return; }
  if (!co || !Array.isArray(co.soldiers) || !co.soldiers.length) { toast("Company roster is empty"); return; }
  confirmModal("Import from Company deck?", `Add ${co.soldiers.length} Soldiers from the Company deck into a new unit? Existing Group data is kept.`, () => {
    // create a unit to hold the imported company
    const unitLabel = (co.settings && co.settings.unit && co.settings.unit.name) || "Imported Co";
    let unit = S().units.find(u=>u.name===unitLabel);
    if (!unit) { unit = { id:uid("unit"), name:unitLabel, leader:(co.settings&&co.settings.unit&&co.settings.unit.firstSergeant)||"" }; S().units.push(unit); }
    // merge duty statuses / requirements ids assumed compatible (same defaults). Map missing gracefully.
    for (const cs of co.soldiers) {
      DB.soldiers.push({
        id: uid("sol"), lastName:cs.lastName, firstName:cs.firstName, rank:cs.rank, mos:cs.mos,
        unitId: unit.id, dutyStatus: getStatusDef(cs.dutyStatus).id, dodid:cs.dodid, phone:cs.phone,
        dateAssigned:cs.dateAssigned, notes:cs.notes, emergency:"", readiness: cs.readiness || {},
      });
    }
    save(); render(); toast(`Imported ${co.soldiers.length} Soldiers into ${unit.name}`);
  });
}
function confirmModal(title, msg, onYes, danger=false) {
  openModal(title, `<p style="margin:0;font-size:14px">${esc(msg)}</p>`, [
    { label:"Cancel", cls:"", act:closeModal },
    { label:"Confirm", cls: danger?"":"primary", act:()=>{ closeModal(); onYes(); } },
  ]);
  if (danger) { const b=$('#modal [data-mbtn="1"]'); if(b){ b.style.background="var(--crit)"; b.style.borderColor="var(--crit)"; b.style.color="#fff"; } }
}

/* ============================ Theme ============================ */
function applyTheme() {
  const t = S().theme || "auto";
  if (t === "auto") { const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; document.documentElement.setAttribute("data-theme", dark ? "dark" : "light"); }
  else document.documentElement.setAttribute("data-theme", t);
}
window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(S().theme==="auto") applyTheme(); });

/* ============================ Global event handling ============================ */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-nav],[data-act],[data-mbtn],[data-close],[data-reveal],[data-view-soldier],[data-edit-soldier],[data-del-soldier],[data-view-case],[data-edit-case],[data-del-case],[data-edit-task],[data-del-task],[data-edit-counseling],[data-del-counseling],[data-edit-resource],[data-del-resource],[data-del-req],[data-del-status],[data-del-unit],[data-del-caretype],[data-del-severity],[data-del-carestatus],[data-delchip],[data-theme-opt]");
  if (!t) return;
  if (t.dataset.nav) { nav(t.dataset.nav); return; }
  if (t.hasAttribute("data-close")) { closeModal(); return; }
  if (t.dataset.mbtn != null) { const b = $("#modal")._buttons[+t.dataset.mbtn]; if (b && b.act) b.act(); return; }
  if (t.hasAttribute("data-reveal")) { revealSensitive = !revealSensitive; render(); return; }

  if (t.dataset.viewSoldier) { soldierDetail(t.dataset.viewSoldier); return; }
  if (t.dataset.editSoldier) { soldierForm(DB.soldiers.find(s=>s.id===t.dataset.editSoldier)); return; }
  if (t.dataset.delSoldier) { const s=DB.soldiers.find(x=>x.id===t.dataset.delSoldier);
    confirmModal("Remove Soldier?", `Remove ${soldierName(s)}? Their cases and counseling entries remain in the log.`, ()=>{ DB.soldiers=DB.soldiers.filter(x=>x.id!==s.id); save(); render(); toast("Soldier removed"); }, true); return; }

  if (t.dataset.viewCase) { caseDetail(t.dataset.viewCase); return; }
  if (t.dataset.editCase) { caseForm(DB.cases.find(x=>x.id===t.dataset.editCase)); return; }
  if (t.dataset.delCase) { confirmModal("Delete case?","This case and its notes will be removed.",()=>{ DB.cases=DB.cases.filter(x=>x.id!==t.dataset.delCase); save(); render(); }, true); return; }

  if (t.dataset.editTask) { taskForm(DB.tasks.find(x=>x.id===t.dataset.editTask)); return; }
  if (t.dataset.delTask) { confirmModal("Delete suspense?","This tasker will be removed.",()=>{ DB.tasks=DB.tasks.filter(x=>x.id!==t.dataset.delTask); save(); render(); }, true); return; }
  if (t.dataset.editCounseling) { counselingForm(DB.counselings.find(x=>x.id===t.dataset.editCounseling)); return; }
  if (t.dataset.delCounseling) { confirmModal("Delete entry?","This log entry will be removed.",()=>{ DB.counselings=DB.counselings.filter(x=>x.id!==t.dataset.delCounseling); save(); render(); }, true); return; }
  if (t.dataset.editResource) { resourceForm(S().resources.find(x=>x.id===t.dataset.editResource)); return; }
  if (t.dataset.delResource) { confirmModal("Delete resource?","This referral resource will be removed.",()=>{ S().resources=S().resources.filter(x=>x.id!==t.dataset.delResource); save(); render(); }, true); return; }

  if (t.dataset.delReq) { saveReqsFromDOM(); S().requirements=S().requirements.filter(r=>r.id!==t.dataset.delReq); save(); render(); return; }
  if (t.dataset.delStatus) {
    if (DB.soldiers.some(s=>s.dutyStatus===t.dataset.delStatus)) { toast("Status in use — reassign Soldiers first"); return; }
    saveStatusesFromDOM(); S().dutyStatuses=S().dutyStatuses.filter(d=>d.id!==t.dataset.delStatus); save(); render(); return;
  }
  if (t.dataset.delUnit) {
    if (DB.soldiers.some(s=>s.unitId===t.dataset.delUnit)) { toast("Unit has Soldiers — reassign them first"); return; }
    saveUnitsFromDOM(); S().units=S().units.filter(u=>u.id!==t.dataset.delUnit); save(); render(); return;
  }
  if (t.dataset.delCaretype) {
    if (DB.cases.some(cs=>cs.typeId===t.dataset.delCaretype)) { toast("Type in use by a case"); return; }
    saveCareTypesFromDOM(); S().careTypes=S().careTypes.filter(x=>x.id!==t.dataset.delCaretype); save(); render(); return;
  }
  if (t.dataset.delSeverity) {
    if (S().careSeverities.length<=1) { toast("Keep at least one severity"); return; }
    if (DB.cases.some(cs=>cs.severityId===t.dataset.delSeverity)) { toast("Severity in use by a case"); return; }
    S().careSeverities=S().careSeverities.filter(x=>x.id!==t.dataset.delSeverity); save(); render(); return;
  }
  if (t.dataset.delCarestatus) {
    if (S().careStatuses.length<=1) { toast("Keep at least one status"); return; }
    if (DB.cases.some(cs=>cs.statusId===t.dataset.delCarestatus)) { toast("Status in use by a case"); return; }
    saveCareStatusesFromDOM(); S().careStatuses=S().careStatuses.filter(x=>x.id!==t.dataset.delCarestatus); save(); render(); return;
  }
  if (t.dataset.delchip) {
    const [kind,val] = t.dataset.delchip.split("|");
    const key = {rank:"ranks",action:"actionTypes"}[kind];
    S()[key] = S()[key].filter(v=>v!==val); save(); render(); return;
  }
  if (t.dataset.themeOpt) { S().theme = t.dataset.themeOpt; save(); applyTheme(); renderSettings($("#content")); return; }
  handleAction(t.dataset.act);
});

function handleAction(act) {
  switch (act) {
    case "add-soldier": soldierForm(null); break;
    case "add-task": taskForm(null); break;
    case "add-counseling": counselingForm(null); break;
    case "add-case": caseForm(null); break;
    case "add-resource": resourceForm(null); break;
    case "seed-demo":
      if (DB.soldiers.length) confirmModal("Load demo data?","This replaces the current roster, cases, suspenses, and logs with a sample battalion.",seedDemo,true);
      else seedDemo();
      break;
    case "print": window.print(); break;
    case "export": exportBackup(); break;
    case "export-csv": exportCSV(); break;
    case "import": $("#importFile").click(); break;
    case "import-company": importFromCompany(); break;
    case "wipe": confirmModal("Clear ALL data?","This permanently erases everything on this device. Export a backup first if unsure.",()=>{ DB=BLANK_DB(); save(); applyTheme(); render(); toast("All data cleared"); },true); break;
    case "save-group": { const g=S().group; g.name=$("#set_gname").value.trim(); g.uic=$("#set_uic").value.trim();
      g.commander=$("#set_cdr").value.trim(); g.groupSergeant=$("#set_1sg").value.trim(); g.motto=$("#set_motto").value.trim(); save(); render(); toast("Group info saved"); break; }
    case "save-units": saveUnitsFromDOM(); save(); render(); toast("Units saved"); break;
    case "add-unit": { const name=$("#nu_name").value.trim(); if(!name){toast("Name required");break;} saveUnitsFromDOM(); S().units.push({id:uid("unit"),name,leader:""}); save(); renderSettings($("#content")); break; }
    case "save-reqs": saveReqsFromDOM(); save(); render(); toast("Requirements saved"); break;
    case "add-req": { const name=$("#nr_name").value.trim(); if(!name){toast("Name required");break;} saveReqsFromDOM();
      S().requirements.push({ id:uid("req"), name, abbr:($("#nr_abbr").value.trim()||name.slice(0,4)).toUpperCase(), cycleDays:Math.max(1,parseInt($("#nr_cycle").value)||365), amberDays:Math.max(0,parseInt($("#nr_amber").value)||60), active:true }); save(); renderSettings($("#content")); break; }
    case "save-statuses": saveStatusesFromDOM(); save(); render(); toast("Statuses saved"); break;
    case "add-status": { const name=$("#ns_name").value.trim(); if(!name){toast("Name required");break;} saveStatusesFromDOM(); S().dutyStatuses.push({ id:uid("ds"), name, present:false, color:"#2a78d6" }); save(); renderSettings($("#content")); break; }
    case "save-caretypes": saveCareTypesFromDOM(); save(); render(); toast("Case types saved"); break;
    case "add-caretype": { const name=$("#nct_name").value.trim(); if(!name){toast("Name required");break;} saveCareTypesFromDOM(); S().careTypes.push({ id:uid("ct"), name, color:"#2c4155", highRisk:false }); save(); renderSettings($("#content")); break; }
    case "add-severity": { const name=$("#nsev_name").value.trim(); if(!name){toast("Name required");break;} S().careSeverities.push({ id:uid("sev"), name, color:"#eda100", weight:Math.max(1,parseInt($("#nsev_w").value)||2) }); S().careSeverities.sort((a,b)=>a.weight-b.weight); save(); renderSettings($("#content")); break; }
    case "save-carestatuses": saveCareStatusesFromDOM(); save(); render(); toast("Statuses saved"); break;
    case "add-carestatus": { const name=$("#ncst_name").value.trim(); if(!name){toast("Name required");break;} saveCareStatusesFromDOM(); S().careStatuses.push({ id:uid("cst"), name, resolved:false }); save(); renderSettings($("#content")); break; }
    case "add-action": addToList("actionTypes", $("#add_action").value.trim()); break;
    case "add-rank": addToList("ranks", $("#add_rank").value.trim()); break;
    case "save-prefs": S().suspenseWarnDays=Math.max(1,parseInt($("#set_warn").value)||7); S().careFollowWarnDays=Math.max(1,parseInt($("#set_carewarn").value)||3); save(); render(); toast("Preferences saved"); break;
  }
}
function addToList(key, val) { if (!val) return; if (!S()[key].includes(val)) S()[key].push(val); save(); renderSettings($("#content")); }

document.addEventListener("change", (e) => { if (e.target.id === "importFile" && e.target.files[0]) importBackup(e.target.files[0]); });
$("#themeBtn").addEventListener("click", () => {
  const order=["light","dark","auto"]; const cur=S().theme||"auto";
  S().theme = order[(order.indexOf(cur)+1)%3]; save(); applyTheme(); if(DB.activeView==="settings") renderSettings($("#content")); toast("Theme: "+S().theme);
});
$("#menuToggle").addEventListener("click", () => $("#sidebar").classList.toggle("open"));
$("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#overlay").classList.contains("show")) closeModal(); });

/* ============================ Boot ============================ */
applyTheme();
render();
</script>
